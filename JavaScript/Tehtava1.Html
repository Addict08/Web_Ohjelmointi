<!DOCTYPE html>
<html lang="fi">
<head>
    <title>Ensimmäinen JavaScript-sivu</title>
</head>
<body>
    <h1>Tervetuloa!</h1>
    <p id="tervehdys"></p>

    <script>
        let Name = "Mirka";
        let Age = 18;
        let currentYear = new Date().getFullYear();
        let year = currentYear - Age;

        document.getElementById("tervehdys").innerHTML = "Hi, my name is " + Name + " and I was born in " + year + ".";
    </script>
</body>
</html>
