<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Yhteystiedot</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #nav-lista {
            list-style-type: none;
            padding: 0;
            margin: 0;
            background-color: #333;
            overflow: hidden;
        }
        #nav-lista li {
            float: left;
        }
        #nav-lista li a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }
        #nav-lista li a:hover {
            background-color: #111;
        }
        .active {
            background-color: #aa0420 !important;
        }
    </style>
</head>
<body> 
    <h1>Tervetuloa Yhteystiedot Sivulle</h1>

    <nav>
        <ul id="nav-lista"></ul>
    </nav>
    <div style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;">
        <h3>Yhteystiedot</h3>
        <p>Ota yhteyttä meihin sähköpostitse tai puhelimitse.</p>
    </div>
    <div id="yhteystiedot"></div>
    <script>
        const Yritys = {
            Nimi: "Yritys Oy",
            Sähköposti: "Yritys.Oy@gmail.com",
            Puhelin: "0102030405"
        }
        const Yhteystiedot1 = {
            Nimi: "Matti Meikäläinen",
            Työtehtävä: "Myyjä",
            Sähköposti: "Matti.Meikalainen@gmail.com",
            Puhelin: "9876543210"
        }
        const Yhteystiedot2 = {
            Nimi: "Maija Manageri",
            Työtehtävä: "Johtaja",
            Sähköposti: "Manageri.Maija84@gmail.com",
            Puhelin: "0123456789"
        }
        const Yhteystiedot3 = {
            Nimi: "Heikki Henkilöstö",
            Työtehtävä: "Henkilöstopäällikkö",
            Sähköposti: "Heikki.Henkilosto@gmail.com",
            Puhelin: "0908070605"
        }
        const sivut = [
            { nimi: "Takaisin Etusivulle", url: "navigaatio.Html" },
            { nimi: "Tuotteet", url: "tuotteet.Html" },
            { nimi: "Yhteystiedot", url: "yhteystiedot.Html" }
        ];
        const yhteystiedotLista = [Yritys, Yhteystiedot1, Yhteystiedot2, Yhteystiedot3];

        const nykyinenSivu = window.location.pathname.split("/").pop();
        const navUl = document.getElementById("nav-lista");

        // Build navigation
        sivut.forEach(function(sivu) {
            const li = document.createElement("li");
            const a = document.createElement("a");
            a.href = sivu.url;
            a.textContent = sivu.nimi;
            if (sivu.url === nykyinenSivu) {
                a.classList.add("active");
            }
            li.appendChild(a);
            navUl.appendChild(li);
        });

        // Render yhteystiedot only once
        const container = document.getElementById("yhteystiedot");
        yhteystiedotLista.forEach(tieto => {
            const div = document.createElement("div");
            div.style.marginBottom = "16px";
            div.innerHTML = `
                <strong>${tieto.Nimi}</strong><br>
                ${tieto.Työtehtävä ? tieto.Työtehtävä + "<br>" : ""}
                Sähköposti: <a href="mailto:${tieto.Sähköposti}">${tieto.Sähköposti}</a><br>
                Puhelin: <a href="tel:${tieto.Puhelin}">${tieto.Puhelin}</a>
            `;
            container.appendChild(div);
        });
    </script>
</body>
</html>
